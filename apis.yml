aid: lilt
name: Lilt
description: 'LILT is an AI translation and localization platform that pairs contextual, adaptive machine
  translation with human linguist verification. The LILT REST API (https://api.lilt.com) exposes the platform
  programmatically: adaptive machine translation, large-scale translation memory and the Lexicon termbase,
  document and file translation, job/project/segment management, Lilt Create multilingual content generation,
  workflow templates, domains, cloud and multipart uploads, and webhook configuration. LILT also ships
  connectors for CMS, DAM and repository systems, first-party Python, Node and Java SDKs, and a hosted
  remote MCP server at mcp.lilt.com for agent-driven translation.'
