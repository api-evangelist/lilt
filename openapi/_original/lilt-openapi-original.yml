          example: TRANSLATE
          enum:
            - READY_TO_START
            - TRANSLATE
            - REVIEW
            - SECONDARY_REVIEW
            - DONE
      description: A single stage within a Workflow Template.
    WorkflowTemplate:
      type: object
      properties:
        id:
          type: number
          description: >-
            Identifier of a teams Workflow template. Can be used during Job
