description: >-
  Versioning, deprecation and operational-transparency posture for the LILT API.
  LILT ships a dated product-updates feed and an Atlassian Statuspage, and
  announces breaking changes there, but publishes no formal deprecation policy
  document, no Sunset/Deprecation header support, and no public SLA.

versioning:
  scheme: uri-path
  current: v2
  concurrent: [v2, v3]
  note: >-
    Most of the API is under /v2; webhook configuration and domains are served
    under /v3. There is no version request header and no date-pinning. LILT does
    not publish a version-support window.
  source: openapi/lilt-openapi-original.yml

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  announcement_channel: https://support.lilt.com/kb/what-s-new-in-the-lilt-platform
  note: >-
    Deprecations are announced in the dated Product Updates feed rather than via
    a standing policy page or RFC 8594 response headers. Observed example: the
    March 2026 update "Reviewed and Unreviewed Translation Memory States
    Deprecated".
  observed_announcements:
  - date: '2026-03'
    change: Reviewed and Unreviewed Translation Memory states deprecated.
    source: https://support.lilt.com/kb/what-s-new-in-the-lilt-platform
  - date: '2026-06-30'
    change: >-
      Per-organization rate limits introduced on the pretranslation and
      file-translation endpoints — a behavioural break for high-volume clients,
      pre-announced in the Product Updates feed and a dedicated guide.
    source: https://support.lilt.com/developers/guides/rate-limits

